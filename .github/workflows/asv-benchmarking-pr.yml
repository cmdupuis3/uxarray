name: ASV Benchmarking (PR)

# This workflow runs untrusted fork code, so it only gets a read-only token and
# no write access. It must NOT post comments itself (forks get a read-only token
# -> 403). Instead it uploads the results + PR number as an artifact, and the
# separate asv-benchmarking-comment.yml (triggered via workflow_run) posts the
# comment with the repo's write token. See issue #1547.
permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:

env:
  PR_HEAD_LABEL: ${{ github.event.pull_request.head.label }}

jobs:
  benchmark:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'run-benchmark') && github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    name: Linux
    runs-on: ubuntu-latest
    env:
      ASV_DIR: "./benchmarks"
      CONDA_ENV_FILE: ci/environment.yml

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0


      - name: Record CPU topology
        run: |
          # A diagnostic; never fail the job over it.
          lscpu | grep -E 'Model name|^CPU\(s\):|Thread\(s\) per core|Core\(s\) per socket|Socket\(s\)|CPU max MHz' || lscpu || true

      - name: Set up Conda environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: ${{env.CONDA_ENV_FILE}}
          cache-environment: true
          environment-name: uxarray_build
          cache-environment-key: "${{runner.os}}-${{runner.arch}}-${{hashFiles(env.CONDA_ENV_FILE)}}-benchmark"
          create-args: >-
            asv
            python-build
            mamba

      # asv builds its own conda environment under ``benchmarks/env`
      - name: Cache asv's benchmark environment
        uses: actions/cache@v6
        with:
          path: ${{ env.ASV_DIR }}/env
          key: asv-env-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('benchmarks/asv.conf.json', 'ci/environment.yml') }}
          restore-keys: |
            asv-env-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache the benchmark fixtures
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.ASV_DIR }}/oQU*.nc
            ${{ env.ASV_DIR }}/_io_cache
          key: asv-fixtures-${{ runner.os }}-${{ hashFiles('benchmarks/helpers/_fixtures.py') }}
          restore-keys: |
            asv-fixtures-${{ runner.os }}-

      - name: Run Benchmarks
        shell: bash -l {0}
        id: benchmark
        # Only a pull_request event carries a pull_request payload, so on a
        # manual run every one of these expressions is the empty string. Left
        # unhandled, ``asv continuous`` quietly reads its one remaining
        # argument as a revision and benchmarks it against its own parent,
        # while ``asv compare`` exits 2 for want of a second revision -- which
        # fails the job, so the caches never save and the comment workflow,
        # gated on success, never runs.
        run: |
          set -x
          BASE="${{ github.event.pull_request.base.sha }}"
          LABEL="${PR_HEAD_LABEL:-$GITHUB_REF_NAME}"
          if [ -z "$BASE" ]; then
            # The merge-base rather than main's tip: a manual run benchmarks the
            # branch as it stands, without main's later commits merged in, so
            # comparing against main's tip would charge this branch for them.
            git rev-parse --verify -q origin/main >/dev/null || git fetch -q origin main:refs/remotes/origin/main
            BASE=$(git merge-base "$GITHUB_SHA" origin/main)
          fi
          if [ "$BASE" = "$(git rev-parse "$GITHUB_SHA")" ]; then
            # Dispatched from main itself: compare it against the commit before.
            BASE=$(git rev-parse "$GITHUB_SHA^")
          fi
          # Fail loudly rather than leaving asv to infer a baseline of its own.
          test -n "$BASE" || { echo "could not determine a baseline commit" >&2; exit 1; }
          # Fill the fixture cache before asv preimports the suite, which would otherwise build it serially in the forkserver parent
          (cd .. && python -m benchmarks.helpers._fixtures)
          # ID this runner
          asv machine --yes
          echo "Baseline:  $BASE"
          echo "Contender: ${GITHUB_SHA} ($LABEL)"
          # Run benchmarks for current commit against base
          ASV_OPTIONS="--split --show-stderr"
          asv continuous $ASV_OPTIONS "$BASE" "${GITHUB_SHA}"
          # Save compare results
          asv compare --split "$BASE" "${GITHUB_SHA}" > asv_compare_results.txt
        working-directory: ${{ env.ASV_DIR }}

      # asv records a duration per benchmark, plus ``<build>`` and
      # ``<setup_cache ...>`` entries, in the results file it writes. Printing
      # them is what tells us where a run's wall clock actually went.
      - name: Report where the time went
        if: always()
        shell: bash -l {0}
        run: |
          python - <<'PY' || true
          import glob, json, os

          for path in sorted(glob.glob("benchmarks/results/*/*.json")):
              if os.path.basename(path) in ("machine.json", "benchmarks.json"):
                  continue
              data = json.load(open(path))
              columns = data.get("result_columns") or []
              if "duration" not in columns:
                  continue
              index = columns.index("duration")
              rows = sorted(
                  (float(row[index]), name)
                  for name, row in data["results"].items()
                  if len(row) > index and row[index] is not None
              )
              total = sum(duration for duration, _ in rows) or 1.0
              params = data.get("params", {})
              print(f"\n=== {data['commit_hash'][:8]} on {params.get('cpu', '?')} "
                    f"({params.get('num_cpu', '?')} cpu) ===")
              for key, value in sorted(data.get("durations", {}).items()):
                  print(f"  {value:8.1f}s  {key}")
              print(f"  {total:8.1f}s  all {len(rows)} benchmarks ({total / 60:.1f} min)")
              for duration, name in reversed(rows[-15:]):
                  print(f"  {duration:8.1f}s  {100 * duration / total:5.1f}%  {name}")
          PY

      - name: Save PR number
        if: always()
        run: echo "${{ github.event.pull_request.number }}" > ${{ env.ASV_DIR }}/pr_number.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: asv-benchmark-results-${{ runner.os }}
          path: |
            ${{ env.ASV_DIR }}/results
            ${{ env.ASV_DIR }}/asv_compare_results.txt
            ${{ env.ASV_DIR }}/pr_number.txt
